# Reverse proxy SINAU -> Node (port 4008). Ganti server_name & path sertifikat.
# Wildcard subdomain (opsional, untuk *.sinau.id per lembaga) tinggal tambahkan di server_name;
# aplikasi mengenali tenant dari slug URL (/s/<slug>), bukan dari Host, jadi ini murni kosmetik.

upstream sinau_app { server 127.0.0.1:4008; keepalive 32; }

server {
  listen 80;
  server_name sinau.example.id;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name sinau.example.id;

  ssl_certificate     /etc/letsencrypt/live/sinau.example.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sinau.example.id/privkey.pem;

  client_max_body_size 25m;          # >= UPLOAD_MAX_MB di .env
  gzip on; gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Server-Sent Events (notifikasi realtime) — jangan di-buffer
  location /api/v1/events {
    proxy_pass http://sinau_app;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://sinau_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Aset build Vite (hash di nama file) boleh di-cache lama
  location /assets/ {
    proxy_pass http://sinau_app;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
